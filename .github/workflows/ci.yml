name: Rust CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'llms.txt'
      - 'wrangler.jsonc'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'llms.txt'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Action script syntax
        shell: bash
        run: bash -n action/checkout.sh
      - name: Test folder checkout Action
        uses: ./
        with:
          path: src
          directory: action-test
      - name: Verify folder checkout contents
        shell: bash
        run: |
          test -f action-test/src/main.rs
          test ! -e action-test/tests
      - name: Test full repository Action checkout
        uses: ./
        with:
          directory: action-test-full
      - name: Verify full repository checkout contents
        shell: bash
        run: |
          test -f action-test-full/src/main.rs
          test -f action-test-full/tests/checkout.rs
      - name: Test release packaging metadata
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s tests -p 'test_release_packaging.py'
      - name: Check Linux installer syntax
        shell: bash
        run: sh -n scripts/install-linux.sh
      - name: Test Linux installer
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: sh tests/test_linux_installer.sh
      - name: Run tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
