name: Release packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: got-darwin-aarch64.tar.gz
            platform: unix
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: got-windows-x86_64.zip
            platform: windows
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: got-windows-aarch64.zip
            platform: windows
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: got-linux-x86_64.tar.gz
            platform: unix
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: got-linux-aarch64.tar.gz
            platform: unix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: jimbobbennett/got@v0.1.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.platform == 'unix'
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        shell: bash
        run: |
          mkdir -p stage dist
          cp "target/$TARGET/release/got" stage/got
          tar -C stage -czf "dist/$ARCHIVE" got
      - name: Package Windows archive
        if: matrix.platform == 'windows'
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item "target/$env:TARGET/release/got.exe" stage/got.exe
          Compress-Archive -LiteralPath stage/got.exe -DestinationPath "dist/$env:ARCHIVE" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: got-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: jimbobbennett/got@v0.1.1
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Test release metadata generator
        run: python3 -m unittest discover -s tests -p 'test_release_packaging.py'
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp scripts/install-linux.sh dist/install.sh
          python3 scripts/prepare-release.py \
            --version "${RELEASE_TAG#v}" \
            --dist dist
      - name: Publish GitHub Release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
          fi
      - name: Check Homebrew tap credentials
        id: homebrew_tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::Homebrew tap was not updated. Configure HOMEBREW_TAP_TOKEN to enable publishing."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Homebrew formula to tap
        if: steps.homebrew_tap.outputs.enabled == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          formula_sha=""
          if formula_sha="$(gh api repos/jimbobbennett/homebrew-tap/contents/Formula/got.rb --jq .sha 2>/dev/null)"; then
            echo "Updating the existing Homebrew formula."
          else
            echo "Creating the initial Homebrew formula in the tap."
          fi
          formula_content="$(base64 -w0 dist/got.rb)"
          if [ -n "$formula_sha" ]; then
            gh api --silent --method PUT repos/jimbobbennett/homebrew-tap/contents/Formula/got.rb \
              --field message="Update got formula for ${RELEASE_TAG}" \
              --field content="$formula_content" \
              --field sha="$formula_sha"
          else
            gh api --silent --method PUT repos/jimbobbennett/homebrew-tap/contents/Formula/got.rb \
              --field message="Add got formula for ${RELEASE_TAG}" \
              --field content="$formula_content"
          fi

  update-action-major-tag:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: jimbobbennett/got@v0.1.1
      - name: Update floating major version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR_TAG="v${BASH_REMATCH[1]}"
          else
            echo "::notice::Skipping major tag update for non-stable version $RELEASE_TAG."
            exit 0
          fi

          git fetch --force --tags origin
          LATEST_TAG="$(git tag --list "${MAJOR_TAG}.[0-9]*.[0-9]*" --sort=-version:refname \
            | grep -E "^${MAJOR_TAG}\.[0-9]+\.[0-9]+$" \
            | head -n 1)"
          if [[ "$LATEST_TAG" != "$RELEASE_TAG" ]]; then
            echo "::notice::Keeping $MAJOR_TAG at the newer release $LATEST_TAG."
            exit 0
          fi

          git tag --force --annotate "$MAJOR_TAG" "$RELEASE_TAG" \
            --message "Update $MAJOR_TAG to $RELEASE_TAG"
          git push --force origin "refs/tags/$MAJOR_TAG"

  update-action-version:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: jimbobbennett/got@v0.1.1
        with:
          ref: main
      - name: Update README and documentation site
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/update_action_version.py --version "$RELEASE_TAG"
      - name: Commit documentation version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- README.md docs/index.html; then
            echo "Documentation already references ${RELEASE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.html
          git commit -m "docs: update Action version to ${RELEASE_TAG}"
          git push origin HEAD:main
